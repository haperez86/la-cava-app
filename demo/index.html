:10px 11px;min-width:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:650;color:#536057}.field input,.field select{width:100%}.menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.product-art{height:112px;background:linear-gradient(135deg,#19392e,#385b48);display:grid;place-items:center;font-size:42px}.product-body{padding:13px}.product-body h4{margin:0 0 4px;font-size:14px}.product-body p{margin:0 0 10px;color:var(--muted);font-size:11px}.product-foot{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:white;border-radius:99px;padding:7px 12px;font-size:12px}.tab.active{background:var(--green);color:white;border-color:var(--green)}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:570px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:600;background:#fafbf9}tr:last-child td{border:0}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.modal-back{position:fixed;inset:0;background:#0b1712a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.show{display:flex}.modal{background:white;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{font:600 21px Georgia,serif;margin:0}.close{border:0;background:#f0f2ef;border-radius:50%;width:32px;height:32px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cart-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}. /* Ajustes de usabilidad móvil: botones con espacio, ancho y jerarquía consistentes */
@media(max-width:700px){
  .page-head{display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .page-head>div{width:100%;min-width:0}
  .page-head>.btn,.page-head button{width:100%;min-height:44px;font-size:13px;padding:11px 14px}
  .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .toolbar>.btn,.toolbar>button{width:100%;min-height:44px;white-space:normal;line-height:1.25;padding:10px 8px}
  .toolbar>input,.toolbar>select{grid-column:1/-1;width:100%;min-height:44px}
  .section-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .section-title>div{flex:1 1 100%;min-width:0}
  .section-title>.btn,.section-title>button{flex:1 1 100%;width:100%;min-height:42px}
  .card>.btn,.card>button.btn{max-width:100%;white-space:normal;line-height:1.25}
  .product-foot{flex-wrap:wrap;gap:9px}
  .product-foot>.btn,.product-foot>button{width:100%;min-height:42px}
  .modal-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .modal-actions>.btn,.modal-actions>button{width:100%;min-width:0;min-height:44px;white-space:normal;line-height:1.25;padding:10px 8px}
  .modal-actions>.btn:only-child,.modal-actions>button:only-child{grid-column:1/-1}
  .table-wrap .btn.small{min-height:36px;padding:7px 9px;white-space:nowrap}
  .mobile-nav button{flex:1;min-width:0;min-height:52px;padding:6px 1px;font-size:10px}
}
@media(max-width:380px){
  .toolbar{grid-template-columns:1fr}
  .toolbar>.btn,.toolbar>button{grid-column:1/-1}
  .modal-actions{grid-template-columns:1fr}
  .modal-actions>.btn,.modal-actions>button{grid-column:1/-1}
  .mobile-nav button{font-size:9px}
}


/* Corrección de desbordamiento y jerarquía en móviles */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app,.main,.content,.page,.card,.stats,.layout2{min-width:0;max-width:100%}
@media(max-width:700px){
  .app{width:100%;overflow-x:hidden}
  .main{width:100%;min-width:0;overflow-x:hidden}
  .topbar{width:100%;min-width:0;max-width:100%;padding:0 12px;gap:8px}
  .topbar>div,.user{min-width:0;max-width:100%}
  .user{display:flex;align-items:center;gap:7px}
  .user>span{font-size:10px;white-space:nowrap}
  .user select{max-width:112px;min-width:0;padding:7px 5px!important;font-size:11px!important}
  .content{width:100%;max-width:100%;min-width:0;padding:18px 12px;overflow-x:hidden}
  .page-head{width:100%;min-width:0}
  .page-head h2{overflow-wrap:anywhere}
  .page-head>.btn,.page-head button{width:100%;max-width:100%;min-width:0;white-space:normal}
  .stats{display:grid;grid-template-columns:minmax(0,1fr);width:100%;gap:10px}
  .stats>.card{width:100%;min-width:0;margin:0}
  .card{min-width:0;max-width:100%;overflow-wrap:anywhere}
  .layout2,.table-grid,.menu-grid,.kitchen-grid{min-width:0;max-width:100%}
  .table-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-tile{min-width:0;max-width:100%}
  .toolbar{width:100%;min-width:0}
  .toolbar>*{min-width:0;max-width:100%}
  .section-title>*{min-width:0;max-width:100%}
  .mobile-nav{width:100%;max-width:100%;left:0;right:0}
  .modal-back{width:100%;max-width:100%;overflow-x:hidden}
  .modal{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
  .modal input,.modal select,.modal textarea{max-width:100%;min-width:0}
}
@media(max-width:380px){
  .content{padding-left:10px;padding-right:10px}
  .table-grid{grid-template-columns:minmax(0,1fr)}
  .user>span{display:none}
}


/* Mejoras de distribución para escritorio y tablet; conserva reglas móviles */
@media(min-width:701px){
  .content{padding:30px 34px}
  .kitchen-grid{grid-template-columns:repeat(3,minmax(280px,1fr));gap:20px;align-items:stretch}
  .kitchen-card{padding:24px;min-width:0;display:flex;flex-direction:column}
  .kitchen-card .section-title{align-items:flex-start;gap:14px;margin-bottom:12px}
  .kitchen-card .section-title h3{font-size:23px}
  .kitchen-card .sub{margin:4px 0 12px}
  .kitchen-card .order-row{align-items:center;min-height:54px;padding:14px 0;gap:14px}
  .kitchen-card .order-row strong{font-size:14px;line-height:1.35}
  .kitchen-card .order-row small{font-size:12px;text-align:right;flex:0 0 auto}
  .kitchen-card .modal-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:20px;
    justify-content:stretch;
  }
  .kitchen-card .modal-actions .btn{
    width:100%;min-width:0;min-height:50px;padding:10px 12px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:13px;line-height:1.25;white-space:normal;
  }
}
@media(min-width:701px) and (max-width:1100px){
  .kitchen-grid{grid-template-columns:repeat(2,minmax(260px,1fr));gap:16px}
  .kitchen-card{padding:20px}
  .content{padding:24px}
}

/* ===== Mejoras: estados, avisos, selector de pedido, inventario ===== */
.pill.pending{background:#f3efe6;color:#7a6440}.pill.ready{background:#e3eefb;color:#2f5f8f}.pill.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #2f5f8f44}50%{box-shadow:0 0 0 5px #2f5f8f00}}
.tile-pills{display:flex;gap:5px;flex-wrap:wrap}.table-tile.ready-tile{border-color:#7fa6cf;background:#f5f9fe}
div.table-tile{cursor:default}.legend{align-items:center}.ready-box{border-left:4px solid #4f7fb0;margin-bottom:16px;background:#f7faff}
.order-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.txt-red{color:var(--red)}.txt-amber{color:#96651e}.season{color:#7a5a2c!important;font-weight:600}
.product.off{opacity:.72}.product.off .product-art{filter:grayscale(.8)}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr))}
/* selector de productos del pedido */
.pick-list{display:grid;gap:6px;max-height:min(46vh,380px);overflow-y:auto;overscroll-behavior:contain;padding:2px}
.pick-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.pick-row.off{background:#fafaf8;opacity:.75}.pick-emoji{font-size:24px;width:32px;text-align:center}
.pick-info{flex:1;min-width:0}.pick-info strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick-info small{color:var(--muted);font-size:11px}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;line-height:1}.stepper button:disabled{opacity:.35}.stepper b{min-width:18px;text-align:center}
.cart-box{margin-top:14px}.cart-box h4{margin:0 0 6px}.cart-line{display:block}.cart-main{display:flex;justify-content:space-between;gap:10px}
.note-in{width:100%;margin-top:6px;border:1px dashed var(--line);border-radius:7px;padding:7px 9px;font-size:12px}
.sticky-foot{position:sticky;bottom:-22px;background:#fff;margin:14px -22px -22px;padding:12px 22px 16px;border-top:1px solid var(--line);box-shadow:0 -8px 18px #0000000d;z-index:2}
.sticky-foot .modal-actions{margin-top:8px}.sticky-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.toolbar.legend{display:flex!important;flex-wrap:wrap;gap:6px}.toolbar.legend .pill{width:auto}
.link{border:0;background:none;color:var(--green);font-weight:700;text-decoration:underline;padding:4px}
/* ranking */
.rank-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.rank-row:last-child{border:0}
.rank-n{width:26px;height:26px;border-radius:50%;background:#f1eadb;color:#7a5a2c;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.rank-main{flex:1;min-width:0}.rank-top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar{height:7px;background:#eef1ec;border-radius:9px;margin:6px 0 3px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold);border-radius:9px}
/* campana y avisos */
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;font-size:16px}
.bell b{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.toast-wrap{position:fixed;top:14px;right:14px;z-index:30;display:grid;gap:8px;max-width:min(360px,calc(100vw - 28px))}
.toast{background:var(--green);color:#fff;padding:12px 14px;border-radius:11px;box-shadow:0 10px 30px #0003;font-size:13px;animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast.ready{background:#2f5f8f}.toast.out{opacity:0;transform:translateY(-8px)}@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.side-foot .btn{margin-top:10px;background:transparent;color:#dce4dc;border-color:#ffffff30;width:100%}
@media(max-width:700px){
 .form2{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters>input{grid-column:1/-1}
 .sticky-foot{bottom:calc(-18px - env(safe-area-inset-bottom));margin:14px -16px calc(-18px - env(safe-area-inset-bottom));padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
 .sticky-foot .modal-actions{display:grid;grid-template-columns:1fr 2fr}
 .pick-list{max-height:42vh}.qr-btn{min-height:56px!important;font-size:16px!important}
 .head-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.head-actions .btn{width:100%}
 .toast-wrap{top:auto;bottom:86px;left:12px;right:12px;max-width:none}
}
</style>
</head>

<script>
/* ================== Utilidades ================== */
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoDate(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d)};
const fmtDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const daysUntil=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);
const hhmm=d=>new Date(d).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const store={get:(s,k)=>{try{return s.getItem(k)}catch(e){return null}},set:(s,k,v)=>{try{s.setItem(k,v)}catch(e){}}};
const LS=(()=>{try{return window.localStorage}catch(e){return null}})(),SS=(()=>{try{return window.sessionStorage}catch(e){return null}})();
const STORE_KEY='lacava-demo-v2',EXPIRY_WARN_DAYS=3,TABLES=Array.from({length:12},(_,i)=>i+1);
const denominations=[100000,50000,20000,10000,5000,2000,1000,500,200,100,50];
const PAGE_TITLES={dashboard:'Dashboard',mesas:'Mesas',pedidos:'Pedidos',preparacion:'Preparación',menu:'Menú y productos',caja:'Caja',arqueo:'Arqueo de caja',inventario:'Inventario',informes:'Informes',usuarios:'Usuarios y roles'};

let page='dashboard',selectedTable=1,db=null,ord=null,qrStream=null,qrScanTimer=null;
let activeRole=(SS&&store.get(SS,'lacava-role'))||'Administrador';
let currentWaiter=(SS&&store.get(SS,'lacava-waiter'))||'Laura';
const ui={orders:{status:'Todos',q:''},menu:{q:'',cat:'Todas',state:'Todos'},inv:{q:'',cat:'Todas',state:'Todos',season:'Todas'}};

/* ================== Datos de ejemplo ================== */
function seed(){
 const now=Date.now(),ago=m=>new Date(now-m*60000).toISOString(),year=new Date().getFullYear();
 const lot=(id,qty,days,season='')=>({id,qty,expires:addDays(days),season,received:addDays(-2)});
 const P=(id,name,cat,price,emoji,desc,min,lots,season=null)=>({id,name,cat,price,emoji,desc,min,lots,season,active:true});
 const products=[
  P(1,'Tabla La Cava','Tablas',58000,'🧀','Selección de quesos y charcutería',4,[lot(1,9,3)]),
  P(2,'Tabla para dos','Tablas',42000,'🥖','Para compartir',4,[lot(2,7,4)]),
  P(3,'Copa de vino tinto','Vinos',18000,'🍷','Copa de la casa',10,[lot(3,36,240)]),
  P(4,'Vino botella','Vinos',95000,'🍾','Selección de la casa',3,[lot(4,8,400)]),
  P(5,'Cóctel de frutos rojos','Cócteles',26000,'🍹','Preparación de la casa',5,[lot(5,14,2)]),
  P(6,'Limonada natural','Bebidas',12000,'🍋','Natural y refrescante',5,[lot(6,12,1)]),
  P(7,'Agua','Bebidas',6000,'💧','Agua personal',10,[lot(7,30,180)]),
  P(8,'Postre de la casa','Postres',16000,'🍰','Porción individual',4,[lot(8,2,-1),lot(9,3,1)]),
  P(9,'Tabla vegetariana','Tablas',45000,'🥗','Quesos, frutas y frutos secos',3,[]),
  P(10,'Vino caliente navideño','Vinos',22000,'🎄','Especial de temporada',5,[lot(10,15,20,'Navidad')],{name:'Navidad',until:year+'-12-31'}),
  P(11,'Sangría de verano','Cócteles',24000,'🍊','Especial de temporada',5,[lot(11,6,30,'Verano')],{name:'Verano',until:addDays(-10)})
 ];
 const O=(id,table,waiter,items,status,mins,extra={})=>({id,table,waiter,items:items.map(([product,qty,note=''])=>({product,qty,note})),note:'',status,time:hhmm(ago(mins)),createdAt:ago(mins),paid:false,...extra});
 const paid=(no,method,mins,extra={})=>({paid:true,payment:method,invoiceNo:'LC-'+year+'-'+pad(no).padStart(5,'0'),paidAt:ago(mins),customer:{},cashier:'Camila',...extra});
 const orders=[
  O(98,3,'Laura',[[3,4],[2,1]],'Cerrado',260,paid(1,'Efectivo',200,{received:120000,change:6000})),
  O(99,6,'Andrés',[[1,1],[4,1]],'Cerrado',230,paid(2,'Datáfono',170,{approvalNumber:'845921'})),
  O(100,1,'Laura',[[5,3],[7,2],[3,2]],'Cerrado',150,paid(3,'Transferencia',90)),
  O(101,2,'Laura',[[1,1],[3,2]],'En preparación',18),
  O(102,5,'Andrés',[[5,2,'Sin hielo']],'Listo',12,{readyAt:ago(3)}),
  O(103,8,'Laura',[[2,1],[6,1]],'Pendiente',9)
 ];
 return {version:2,products,orders,
  users:[{id:1,name:'Administrador Demo',username:'admin',role:'Administrador',active:true},{id:2,name:'Laura Gómez',username:'laura',role:'Mesero',active:true},{id:3,name:'Andrés Rojas',username:'andres',role:'Mesero',active:true},{id:4,name:'Camila Torres',username:'camila',role:'Cajero',active:true},{id:5,name:'Jorge Ruiz',username:'jorge',role:'Preparación',active:true}],
  notifications:[{id:1,orderId:102,table:5,waiter:'Andrés',at:ago(3),seen:false}],
  stockMoves:[],
  cashShift:{opened:false,closed:false,base:0,movements:[],count:{},openedAt:null},
  seq:{order:104,invoice:4,lot:20,product:12,notif:2,user:6}};
}
function loadState(){let raw=LS&&store.get(LS,STORE_KEY);try{const s=raw&&JSON.parse(raw);if(s&&s.version===2)return s}catch(e){}return seed()}
function saveState(){if(LS)store.set(LS,STORE_KEY,JSON.stringify(db))}
function commit(){saveState();render()}
function resetDemo(){if(!confirm('¿Restablecer los datos de ejemplo? Se perderán los cambios hechos en la demo.'))return;db=seed();commit();toast('Datos de la demo restablecidos.')}

/* ================== Reglas de negocio ================== */
const product=id=>db.products.find(p=>p.id===id);
const validLots=p=>p.lots.filter(l=>l.qty>0&&l.expires>=todayISO()).sort((a,b)=>a.expires.localeCompare(b.expires));
const expiredLots=p=>p.lots.filter(l=>l.qty>0&&l.expires<todayISO());
const available=p=>validLots(p).reduce((s,l)=>s+l.qty,0);
const nextExpiry=p=>validLots(p)[0]?.expires||null;
const seasonOver=p=>!!(p.season&&p.season.until<todayISO());
function offerBlock(p){if(!p.active)return 'Retirado de la carta';if(seasonOver(p))return 'Fuera de temporada';if(available(p)<1)return 'Agotado';return ''}
function stockState(p){if(!p.active)return {label:'Inactivo',cls:'danger'};if(seasonOver(p))return {label:'Fuera de temporada',cls:'danger'};const a=available(p);if(a<1)return {label:'Agotado',cls:'danger'};if(a<=p.min)return {label:'Stock bajo',cls:'busy'};return {label:'Disponible',cls:''}}
const expiringSoon=p=>{const e=nextExpiry(p);return e!==null&&daysUntil(e)<=EXPIRY_WARN_DAYS};
function consume(p,qty){let left=qty;for(const l of validLots(p)){const t=Math.min(l.qty,left);l.qty-=t;left-=t;if(!left)break}return qty-left}
const totalOrder=o=>o.items.reduce((s,i)=>s+(product(i.product)?.price||0)*i.qty,0);
const openOrders=id=>db.orders.filter(o=>o.table===id&&!o.paid);
const tableTotal=id=>openOrders(id).reduce((s,o)=>s+totalOrder(o),0);
const waiterNames=()=>db.users.filter(u=>u.role==='Mesero'&&u.active).map(u=>u.name.split(' ')[0]);
const myNotifs=()=>db.notifications.filter(n=>!n.seen&&n.waiter===currentWaiter);
function tableState(id){const os=openOrders(id);if(!os.length)return {status:'Disponible'};const has=s=>os.some(o=>o.status===s);return {status:'Ocupada',stage:has('Listo')?'Listo para recoger':has('En preparación')?'En preparación':has('Pendiente')?'Pendiente':'Servido'}}
function statePill(s){const c={'Pendiente':'pending','En preparación':'busy','Listo':'ready','Listo para recoger':'ready glow','Entregado':'','Servido':'','Cerrado':'','Ocupada':'busy','Disponible':''}[s]??'';return `<span class="pill ${c}">${esc(s)}</span>`}
function topProducts(list){const m={};list.forEach(o=>o.items.forEach(i=>{const p=product(i.product);if(!p)return;m[p.id]=m[p.id]||{p,qty:0,value:0};m[p.id].qty+=i.qty;m[p.id].value+=i.qty*p.price}));return Object.values(m).sort((a,b)=>b.qty-a.qty||b.value-a.value)}
const isToday=iso=>iso&&isoDate(new Date(iso))===todayISO();

/* ================== Notificaciones ================== */
function toast(msg,type=''){const w=$('toasts');if(!w)return;const t=document.createElement('div');t.className='toast '+type;t.innerHTML=msg;w.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},4200)}
function buzz(){try{navigator.vibrate&&navigator.vibrate([180,90,180])}catch(e){}}
function updateBell(){const b=$('bell');if(!b)return;let n=0;if(activeRole==='Mesero')n=myNotifs().length;else if(activeRole==='Preparación')n=db.orders.filter(o=>!o.paid&&o.status==='Pendiente').length;b.classList.toggle('hide',!['Mesero','Preparación'].includes(activeRole));$('bellCount').textContent=n;$('bellCount').classList.toggle('hide',!n);b.title=activeRole==='Mesero'?'Pedidos listos para recoger':'Comandas pendientes'}
function bellClick(){go(activeRole==='Mesero'?'mesas':'preparacion')}
/* Sincroniza pestañas del mismo navegador (p. ej. una en Preparación y otra en Mesero) */
window.addEventListener('storage',e=>{if(e.key!==STORE_KEY||!e.newValue)return;let next;try{next=JSON.parse(e.newValue)}catch(err){return}const prev=db;db=next;
 if(activeRole==='Mesero'){const old=new Set(prev.notifications.filter(n=>!n.seen).map(n=>n.id));const fresh=myNotifs().filter(n=>!old.has(n.id));if(fresh.length){buzz();fresh.forEach(n=>toast('🔔 <b>Pedido #'+n.orderId+' listo</b> · Mesa '+n.table+'. Pasa a recogerlo.','ready'))}}
 if(activeRole==='Preparación'){const old=new Set(prev.orders.map(o=>o.id));db.orders.filter(o=>!old.has(o.id)).forEach(o=>{buzz();toast('♨ <b>Nuevo pedido #'+o.id+'</b> · Mesa '+o.table+' · '+esc(o.waiter))})}
 if(!$('modalBack').classList.contains('show'))render();else updateBell();});

/* ================== Navegación ================== */
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('crumb').textContent=PAGE_TITLES[p];render()}
document.querySelectorAll('#sideNav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">La Cava · Copas y tablas</div><h2>${title}</h2><p class="sub">${sub}</p></div>${action}</div>`}
function render(){const v=$('view');({dashboard:dash,mesas:renderTables,pedidos:renderOrders,preparacion:renderKitchen,menu:renderMenu,caja:renderCash,arqueo:renderArqueo,inventario:renderInventory,informes:renderReports,usuarios:renderUsers})[page](v);updateBell()}

/* ================== Dashboard ================== */
function tileHTML(id,clickable=true){const st=tableState(id),os=openOrders(id),last=os.at(-1);const inner=`<span class="tile-pills"><span class="pill ${st.status==='Ocupada'?'busy':''}">${st.status}</span>${st.stage?statePill(st.stage):''}</span><span class="num">Mesa ${id}</span><span class="meta">${os.length?os.length+' pedido(s) · '+money(tableTotal(id))+' · '+esc(last.waiter):'Sin pedidos abiertos'}</span>`;const cls='table-tile '+(st.status==='Ocupada'?'occupied ':'')+(st.stage==='Listo para recoger'?'ready-tile':'');return clickable?`<button class="${cls}" onclick="openTable(${id})">${inner}</button>`:`<div class="${cls}">${inner}</div>`}
function dash(v){const open=db.orders.filter(o=>!o.paid),todayPaid=db.orders.filter(o=>o.paid&&isToday(o.paidAt)),month=todayISO().slice(0,7),top=topProducts(monthOrders(month))[0];
 const alerts=db.products.filter(p=>p.active&&!seasonOver(p)&&available(p)<1).length,soon=db.products.filter(p=>expiringSoon(p)).length,exp=db.products.filter(p=>expiredLots(p).length).length;
 v.innerHTML=head('Resumen del servicio','Una vista rápida de la operación de hoy',`<button class="btn primary" onclick="openOrder()">＋ Nuevo pedido</button>`)+`
 <div class="grid stats"><div class="card"><div class="stat-label">Ventas cobradas hoy</div><div class="stat-value">${money(todayPaid.reduce((s,o)=>s+totalOrder(o),0))}</div><div class="stat-note">${new Set(todayPaid.map(o=>o.invoiceNo)).size} comprobante(s)</div></div><div class="card"><div class="stat-label">Pedidos activos</div><div class="stat-value">${open.length}</div><div class="stat-note">${open.filter(o=>o.status==='Listo').length} listo(s) para recoger</div></div><div class="card"><div class="stat-label">Mesas ocupadas</div><div class="stat-value">${TABLES.filter(t=>openOrders(t).length).length} / ${TABLES.length}</div><div class="stat-note">Mesas en servicio</div></div><div class="card"><div class="stat-label">Por cobrar</div><div class="stat-value">${money(open.reduce((s,o)=>s+totalOrder(o),0))}</div><div class="stat-note">Cuentas abiertas</div></div></div>
 ${activeRole==='Administrador'?`<div class="grid stats"><div class="card"><div class="stat-label">Producto más vendido del mes</div><div class="stat-value" style="font-size:19px">${top?top.p.emoji+' '+esc(top.p.name):'—'}</div><div class="stat-note">${top?top.qty+' unidades · '+money(top.value):'Sin ventas este mes'}</div></div><div class="card" onclick="ui.inv.state='Agotado';go('inventario')" style="cursor:pointer"><div class="stat-label">Productos agotados</div><div class="stat-value" style="color:${alerts?'var(--red)':'inherit'}">${alerts}</div><div class="stat-note">No se ofrecen en la carta</div></div><div class="card" onclick="ui.inv.state='Por vencer';go('inventario')" style="cursor:pointer"><div class="stat-label">Por vencer (≤ ${EXPIRY_WARN_DAYS} días)</div><div class="stat-value" style="color:${soon?'var(--amber)':'inherit'}">${soon}</div><div class="stat-note">Productos con lote próximo a vencer</div></div><div class="card" onclick="ui.inv.state='Con lotes vencidos';go('inventario')" style="cursor:pointer"><div class="stat-label">Con lotes vencidos</div><div class="stat-value" style="color:${exp?'var(--red)':'inherit'}">${exp}</div><div class="stat-note">Pendientes de dar de baja</div></div></div>`:''}
 <div class="grid layout2"><section class="card"><div class="section-title"><h3>Estado de las mesas</h3><button class="btn small" onclick="go('mesas')">Ver todas</button></div><div class="grid table-grid">${TABLES.slice(0,8).map(t=>tileHTML(t)).join('')}</div></section>
 <section class="card"><div class="section-title"><h3>Actividad reciente</h3>${activeRole==='Administrador'?`<button class="btn small" onclick="go('preparacion')">Ver comandas</button>`:''}</div><div class="list">${db.orders.slice().reverse().slice(0,6).map(o=>`<div class="order-row"><div><strong>Pedido #${o.id} · Mesa ${o.table}</strong><small>${esc(o.waiter)} · ${o.time} · ${esc(o.status)}</small></div><span class="money">${money(totalOrder(o))}</span></div>`).join('')}</div></section></div>`}

/* ================== Mesas ================== */
const LEGEND='<div class="toolbar legend"><span class="pill">● Disponible</span><span class="pill busy">● Ocupada</span><span class="pill pending">Pendiente</span><span class="pill busy">En preparación</span><span class="pill ready">Listo para recoger</span><span class="pill">Servido</span></div>';
function renderTables(v){
 if(activeRole==='Mesero'){
  const notes=myNotifs(),mine=db.orders.filter(o=>!o.paid&&o.waiter===currentWaiter&&o.status!=='Entregado');
  v.innerHTML=head('Mis mesas','Hola '+esc(currentWaiter)+'. Escanea el QR de la mesa para cargarla y asignarle pedidos.',`<button class="btn primary qr-btn" onclick="openQrScanner()">▦ Escanear QR de mesa</button>`)+
  (notes.length?`<section class="card ready-box"><div class="section-title"><h3>🔔 Listos para recoger</h3><span class="pill ready glow">${notes.length}</span></div>${notes.map(n=>{const o=db.orders.find(x=>x.id===n.orderId);return `<div class="order-row"><div><strong>Pedido #${n.orderId} · Mesa ${n.table}</strong><small>${o?o.items.map(i=>i.qty+'× '+esc(product(i.product)?.name)).join(', '):''} · avisado ${hhmm(n.at)}</small></div><button class="btn primary small" onclick="deliverOrder(${n.orderId})">Recogido y entregado</button></div>`}).join('')}</section>`:'')+
  `<section class="card" style="margin-bottom:16px"><div class="section-title"><h3>Mis pedidos en curso</h3><span class="pill">${mine.length}</span></div>${mine.length?mine.map(o=>`<div class="order-row"><div><strong>Pedido #${o.id} · Mesa ${o.table}</strong><small>${o.time} · ${o.items.reduce((s,i)=>s+i.qty,0)} producto(s)</small></div>${statePill(o.status)}</div>`).join(''):'<div class="empty">No tienes pedidos en curso.</div>'}</section>`+
  LEGEND+`<div class="grid table-grid">${TABLES.map(t=>tileHTML(t,false)).join('')}</div><p class="notice">Para abrir una mesa, escanea el código QR pegado en ella. Así el pedido queda asignado a la mesa correcta.</p>`;return}
 v.innerHTML=head('Mesas','Consulta las mesas, el estado de sus pedidos y sus cuentas.')+LEGEND+`<div class="grid table-grid">${TABLES.map(t=>tileHTML(t)).join('')}</div>`}
function orderBlock(o,waiterView){return `<section class="order-box"><div class="section-title"><div><strong>Pedido #${o.id}</strong><div class="sub">${esc(o.waiter)} · ${o.time}</div></div>${statePill(o.status)}</div>${o.items.map(i=>{const p=product(i.product);return `<div class="order-row"><div><strong>${i.qty} × ${esc(p?.name||'Producto')}</strong>${i.note?`<small>Obs.: ${esc(i.note)}</small>`:''}</div><span class="money">${money((p?.price||0)*i.qty)}</span></div>`}).join('')}${o.note?`<p class="sub">Observación: ${esc(o.note)}</p>`:''}${waiterView&&o.status==='Listo'?`<button class="btn primary" style="width:100%;margin-top:8px" onclick="deliverOrder(${o.id},true)">Recogido y entregado en la mesa</button>`:''}</section>`}
function openTable(id,viaQr=false){
 if(activeRole==='Mesero'&&!viaQr){toast('Escanea el QR de la mesa para abrirla.');return}
 selectedTable=id;const os=openOrders(id);
 if(activeRole==='Mesero'){showModal(`<div class="modal-head"><div><div class="eyebrow">Mesa cargada por QR · ${esc(currentWaiter)}</div><h3>Mesa ${id}</h3></div><button class="close" onclick="closeModal()">×</button></div>${statePill(os.length?'Ocupada':'Disponible')} <p class="sub">${os.length?os.length+' pedido(s) en la cuenta':'Mesa disponible para recibir un pedido.'}</p>${os.map(o=>orderBlock(o,true)).join('')}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="closeModal();openOrder(${id})">＋ Asignar pedido</button></div>`);return}
 const canPay=['Administrador','Cajero'].includes(activeRole);
 showModal(`<div class="modal-head"><div><div class="eyebrow">Detalle de consumo · Cuenta de mesa</div><h3>Mesa ${id}</h3></div><button class="close" onclick="closeModal()">×</button></div><p class="sub">${os.length?os.length+' pedido(s) asociados':'Esta mesa está disponible'}</p>${os.length?os.map(o=>orderBlock(o,false)).join(''):'<div class="empty">Aún no hay pedidos en esta mesa.</div>'}<div class="total-line"><span>Total pendiente de la mesa</span><span>${money(tableTotal(id))}</span></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="closeModal();openOrder(${id})">＋ Agregar pedido</button>${os.length&&canPay?`<button class="btn gold" onclick="closeModal();payTable(${id})">Cobrar cuenta</button>`:''}</div>`)}
function deliverOrder(orderId,fromModal){const o=db.orders.find(x=>x.id===orderId);if(!o||o.status!=='Listo'){toast('Ese pedido ya no está pendiente de recoger.');return}o.status='Entregado';o.deliveredAt=new Date().toISOString();db.notifications.forEach(n=>{if(n.orderId===orderId)n.seen=true});if(fromModal)closeModal();commit();toast('✓ Pedido #'+o.id+' entregado en la mesa '+o.table+'.')}

/* ================== QR ================== */
function openQrScanner(){showModal('<div class="modal-head"><h3>Escanear QR de mesa</h3><button class="close" onclick="stopQrCamera();closeModal()">×</button></div><p class="sub">Apunta la cámara al código QR de la mesa. Si la cámara no está disponible, escribe el código impreso.</p><video id="qrVideo" playsinline muted style="width:100%;max-height:260px;background:#111;border-radius:12px;display:none;margin-top:10px"></video><div class="field"><label>Código de mesa</label><input id="qrCodeInput" placeholder="LACAVA:MESA:4" autocomplete="off" onkeydown="if(event.key===\'Enter\')loadQrTable()"></div><div class="modal-actions"><button class="btn" onclick="startQrCamera()">Activar cámara</button><button class="btn primary" onclick="loadQrTable()">Cargar mesa</button></div><p class="sub" id="qrStatus">Formato de demo: LACAVA:MESA:1 a LACAVA:MESA:12 (también acepta M4).</p>');if(window.isSecureContext&&'BarcodeDetector'in window)startQrCamera()}
function stopQrCamera(){if(qrScanTimer){clearInterval(qrScanTimer);qrScanTimer=null}if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}}
async function startQrCamera(){if(!('BarcodeDetector'in window)){$('qrStatus').textContent='Este navegador no lee QR con la cámara (p. ej. Safari en iPhone). Escribe el código de la mesa.';return}try{const detector=new BarcodeDetector({formats:['qr_code']});qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const video=$('qrVideo');if(!video){stopQrCamera();return}video.srcObject=qrStream;video.style.display='block';await video.play();$('qrStatus').textContent='Buscando código QR…';qrScanTimer=setInterval(async()=>{try{const codes=await detector.detect(video);if(codes.length){$('qrCodeInput').value=codes[0].rawValue;loadQrTable()}}catch(e){}},350)}catch(e){$('qrStatus').textContent='No se pudo activar la cámara. Revisa los permisos o escribe el código.'}}
function loadQrTable(){const value=$('qrCodeInput').value.trim();const m=value.match(/(?:LACAVA\s*[:_-]?\s*)?(?:MESA|TABLE)\s*[:_-]?\s*(\d+)/i)||value.match(/^M(\d+)$/i);const id=Number(m&&m[1]);if(!id||!TABLES.includes(id)){$('qrStatus').textContent='Código inválido. Usa LACAVA:MESA:1 hasta LACAVA:MESA:12.';return}stopQrCamera();closeModal();openTable(id,true)}

 ${waiter?'':`<div class="form2"><div class="field"><label>Mesa</label><select id="orderTable">${TABLES.map(t=>`<option value="${t}" ${t===tableId?'selected':''}>Mesa ${t}${openOrders(t).length?' · Ocupada':''}</option>`).join('')}</select></div><div class="field"><label>Mesero que atiende</label><select id="orderWaiter">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div></div>`}

 $('pickerList').innerHTML=list.length?list.map(p=>{const block=offerBlock(p),item=ord.cart.find(x=>x.id===p.id),left=available(p)-(item?.qty||0);
  return `<div class="pick-row ${block?'off':''}"><span class="pick-emoji">${p.emoji}</span><div class="pick-info"><strong>${esc(p.name)}</strong><small>${money(p.price)} · ${block?`<b class="txt-red">${block}</b>`:left+' disponible(s)'}${p.season&&!block?' · '+esc(p.season.name):''}</small></div>${block?'<span class="pill danger">No disponible</span>':item?`<div class="stepper"><button onclick="cartAdd(${p.id},-1)" aria-label="Quitar">−</button><b>${item.qty}</b><button onclick="cartAdd(${p.id},1)" ${left<1?'disabled':''} aria-label="Agregar">+</button></div>`:`<button class="btn small" onclick="cartAdd(${p.id},1)">Agregar</button>`}</div>`}).join(''):'<div class="empty">No hay productos que coincidan con el filtro.</div>'}

function drawCart(){const units=ord.cart.reduce((s,x)=>s+x.qty,0),total=ord.cart.reduce((s,x)=>s+x.qty*product(x.id).price,0);
 $('cartBox').innerHTML='<h4>Pedido actual</h4>'+(ord.cart.length?ord.cart.map(x=>{const p=product(x.id);return `<div class="cart-line"><div class="cart-main"><span>${x.qty} × ${esc(p.name)}</span><strong>${money(p.price*x.qty)}</strong></div><input class="note-in" maxlength="80" placeholder="Observación (ej. sin hielo)" value="${esc(x.note)}" oninput="ord.cart.find(c=>c.id===${x.id}).note=this.value"></div>`}).join(''):'<div class="empty">Agrega productos al pedido.</div>');
 $('cartSum').innerHTML=units?`<b>${units}</b> producto(s) · <b>${money(total)}</b>`:'Sin productos';$('sendOrderBtn').disabled=!units}
function saveOrder(){if(!ord||!ord.cart.length){alert('Agrega al menos un producto.');return}

 const waiter=activeRole==='Mesero';const table=waiter?ord.table:Number($('orderTable').value),who=waiter?currentWaiter:$('orderWaiter').value;
 if(!who){alert('No hay meseros activos para asignar.');return}
 ord.cart.forEach(x=>consume(product(x.id),x.qty));
 const now=new Date().toISOString(),o={id:db.seq.order++,table,waiter:who,items:ord.cart.map(x=>({product:x.id,qty:x.qty,note:x.note.trim()})),note:$('orderNote').value.trim(),status:'Pendiente',time:hhmm(now),createdAt:now,paid:false};
 db.orders.push(o);ord=null;closeModal();

function addProduct(){const cats=[...new Set(db.products.map(p=>p.cat))];showModal(`<div class="modal-head"><h3>Nuevo producto</h3><button class="close" onclick="closeModal()">×</button></div><div class="form2"><div class="field"><label>Nombre *</label><input id="pName" maxlength="60"></div><div class="field"><label>Categoría *</label><input id="pCat" list="catList" placeholder="Ej. Vinos"><datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>Precio (COP) *</label><input id="pPrice" type="number" min="1"></div><div class="field"><label>Stock mínimo</label><input id="pMin" type="number" min="0" value="5"></div></div><div class="field"><label>Descripción</label><input id="pDesc" maxlength="80"></div><h4 style="margin:16px 0 0">Temporada (opcional)</h4><p class="sub">Si es un producto de temporada, deja de ofrecerse automáticamente después de la fecha final.</p><div class="form2"><div class="field"><label>Temporada</label><input id="pSeason" list="seasonList" placeholder="Ej. Navidad"><datalist id="seasonList">${allSeasons().map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div><div class="field"><label>Disponible hasta</label><input id="pUntil" type="date" min="${todayISO()}"></div></div><h4 style="margin:16px 0 0">Inventario inicial (opcional)</h4><div class="form2"><div class="field"><label>Cantidad</label><input id="pQty" type="number" min="0" value="0"></div><div class="field"><label>Fecha de vencimiento</label><input id="pExp" type="date" min="${todayISO()}"></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct()">Guardar producto</button></div>`)}

 if(!name||!cat||!(price>0)){alert('Ingresa nombre, categoría y un precio válido.');return}

/* ================== Inventario ================== */

 const out=db.products.filter(p=>p.active&&!seasonOver(p)&&available(p)<1).length,low=db.products.filter(p=>stockState(p).label==='Stock bajo').length,soon=db.products.filter(expiringSoon).length,expd=db.products.reduce((s,p)=>s+expiredLots(p).reduce((a,l)=>a+l.qty,0),0);

 `<div class="grid stats"><div class="card"><div class="stat-label">Agotados (no se ofrecen)</div><div class="stat-value" style="color:${out?'var(--red)':'inherit'}">${out}</div></div><div class="card"><div class="stat-label">Stock bajo</div><div class="stat-value" style="color:${low?'var(--amber)':'inherit'}">${low}</div></div><div class="card"><div class="stat-label">Vencen en ≤ ${EXPIRY_WARN_DAYS} días</div><div class="stat-value" style="color:${soon?'var(--amber)':'inherit'}">${soon}</div></div><div class="card"><div class="stat-label">Unidades vencidas</div><div class="stat-value" style="color:${expd?'var(--red)':'inherit'}">${expd}</div>${expd?'<button class="btn small" onclick="writeOffExpired()">Dar de baja vencidos</button>':'<div class="stat-note">Sin vencidos</div>'}</div></div>
 <div class="toolbar filters"><input type="search" placeholder="Buscar producto…" value="${esc(f.q)}" oninput="ui.inv.q=this.value.trim().toLowerCase();fillInventory()"><select onchange="ui.inv.cat=this.value;fillInventory()">${cats.map(c=>`<option value="${esc(c)}" ${f.cat===c?'selected':''}>${c==='Todas'?'Todas las categorías':esc(c)}</option>`).join('')}</select><select onchange="ui.inv.state=this.value;fillInventory()">${['Todos','Disponible','Stock bajo','Agotado','Por vencer','Con lotes vencidos','Fuera de temporada'].map(s=>`<option value="${s}" ${f.state===s?'selected':''}>${s==='Todos'?'Todos los estados':s}</option>`).join('')}</select><select onchange="ui.inv.season=this.value;fillInventory()" aria-label="Temporada">${seasons.map(s=>`<option value="${esc(s)}" ${f.season===s?'selected':''}>${s==='Todas'?'Todas las temporadas':esc(s)}</option>`).join('')}</select></div>
 <div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Temporada</th><th>Disponible</th><th>Mínimo</th><th>Próximo vencimiento</th><th>Estado</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div>

function openCashShift(){const n=Number($('openingBase').value);if(!Number.isFinite(n)||n<0||$('openingBase').value===''){alert('Ingresa una base inicial válida');return}db.cashShift={opened:true,closed:false,base:n,movements:[],count:{},openedAt:new Date().toISOString()};commit();toast('Caja abierta.')}
function newCashShift(){db.cashShift={opened:false,closed:false,base:0,movements:[],count:{},openedAt:null};commit()}
function cashMovement(){showModal(`<div class="modal-head"><h3>Movimiento de caja</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tipo de movimiento</label><select id="moveType"><option>Entrada</option><option>Salida</option></select></div><div class="field"><label>Concepto</label><input id="moveReason" placeholder="Ej. compra urgente de insumos"></div><div class="field"><label>Valor (COP)</label><input id="moveAmount" type="number" min="1"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCashMovement()">Guardar movimiento</button></div>`)}
function saveCashMovement(){const amount=Number($('moveAmount').value),reason=$('moveReason').value.trim(),type=$('moveType').value;if(!(amount>0)||!reason){alert('Completa el concepto y un valor válido.');return}db.cashShift.movements.push({type,amount,reason,time:new Date().toLocaleString('es-CO')});closeModal();commit()}
function setCashCount(d,v){db.cashShift.count[d]=Math.max(0,Math.floor(Number(v)||0));commit()}
function clearCashCount(){db.cashShift.count={};commit()}
function closeCashShift(){const expected=shiftExpected(),counted=countedCash(),diff=counted-expected;if(!confirm(`¿Confirmas el cierre de caja?\nEfectivo esperado: ${money(expected)}\nEfectivo contado: ${money(counted)}\nDiferencia: ${money(diff)}`))return;db.cashShift.opened=false;db.cashShift.closed=true;commit();toast('Cierre de caja registrado.')}

/* ================== Roles ================== */
const ROLE_PAGES={Administrador:['dashboard','mesas','pedidos','preparacion','menu','caja','arqueo','inventario','informes','usuarios'],Cajero:['dashboard','mesas','pedidos','caja','arqueo'],Mesero:['mesas'],'Preparación':['preparacion']};
const ROLE_MOBILE={Administrador:[['dashboard','⌂','Inicio'],['mesas','▦','Mesas'],['pedidos','＋','Pedidos'],['caja','＄','Caja'],['inventario','▤','Inventario'],['informes','▥','Informes']],Cajero:[['dashboard','⌂','Inicio'],['mesas','▦','Mesas'],['caja','＄','Caja'],['arqueo','▣','Arqueo']],Mesero:[['mesas','▦','Mis mesas']],'Preparación':[['preparacion','♨','Comandas']]};
function switchRole(role){if(!ROLE_PAGES[role])role='Administrador';activeRole=role;if(SS)store.set(SS,'lacava-role',role);$('roleSimulator').value=role;
 $('roleAvatar').textContent={Administrador:'AD',Cajero:'CJ',Mesero:'ME','Preparación':'PR'}[role];
 const allowed=ROLE_PAGES[role];document.querySelectorAll('#sideNav [data-page]').forEach(b=>b.classList.toggle('hide',!allowed.includes(b.dataset.page)));
 $('mobileNav').innerHTML=ROLE_MOBILE[role].map(([p,icon,label])=>`<button data-page="${p}" class="${page===p?'active':''}"><span>${icon}</span>${label}</button>`).join('');
 document.querySelectorAll('#mobileNav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
 refreshWaiterSelect();
 go(allowed.includes(page)?page:allowed[0]);
 if(role==='Mesero'&&myNotifs().length){buzz();toast('🔔 Tienes '+myNotifs().length+' pedido(s) listo(s) para recoger.','ready')}}
function refreshWaiterSelect(){const sel=$('waiterSelect'),names=waiterNames();if(!names.includes(currentWaiter))currentWaiter=names[0]||'';sel.innerHTML=names.map(n=>`<option ${n===currentWaiter?'selected':''}>${esc(n)}</option>`).join('');sel.classList.toggle('hide',activeRole!=='Mesero')}
function setWaiter(n){currentWaiter=n;if(SS)store.set(SS,'lacava-waiter',n);render();if(myNotifs().length)toast('🔔 '+esc(n)+' tiene '+myNotifs().length+' pedido(s) listo(s).','ready')}

/* ================== Usuarios ================== */
function renderUsers(v){const roles=[{name:'Administrador',icon:'🛡️',desc:'Control completo del negocio, configuración y supervisión.',perms:'Dashboard · Usuarios · Productos · Mesas · Inventario · Caja · Arqueo · Informes'},{name:'Cajero',icon:'💳',desc:'Gestiona cuentas, cobros, facturas, apertura y cierre de caja.',perms:'Mesas · Cuentas · Pagos · Facturas · Caja · Arqueo'},{name:'Mesero',icon:'🍽️',desc:'Desde el celular: escanea el QR de la mesa, asigna pedidos y recibe aviso cuando están listos.',perms:'Mis mesas · Escaneo QR · Pedidos · Entregas'},{name:'Preparación',icon:'👨‍🍳',desc:'Recibe las comandas, las prepara y avisa al mesero al terminar.',perms:'Comandas · Estados de preparación · Avisos'}];
 v.innerHTML=head('Usuarios y roles','Administra los accesos y responsabilidades del equipo',`<button class="btn primary" onclick="newAppUser()">＋ Crear usuario</button>`)+`<div class="grid stats" style="margin-bottom:18px">${roles.map(r=>`<div class="card"><div style="font-size:27px">${r.icon}</div><h3 style="font:600 19px Georgia,serif;margin:8px 0">${r.name}</h3><p class="sub">${r.desc}</p><div class="notice">${r.perms}</div></div>`).join('')}</div>
 <div class="card"><div class="section-title"><div><h3>Equipo de La Cava</h3><p class="sub">Usuarios registrados en la demostración</p></div><span class="pill">${db.users.filter(u=>u.active).length} activos</span></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(u.username)}</td><td><span class="pill">${esc(u.role)}</span></td><td><span class="pill ${u.active?'':'danger'}">${u.active?'Activo':'Inactivo'}</span></td><td><button class="btn small" onclick="toggleAppUser(${u.id})">${u.active?'Desactivar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div><div class="notice">El selector de rol en la barra superior simula las vistas de cada perfil. La autenticación y el control de permisos definitivo requieren backend.</div></div>`}
function newAppUser(){showModal(`<div class="modal-head"><h3>Crear usuario</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nombre completo</label><input id="uName" placeholder="Nombre del empleado"></div><div class="field"><label>Nombre de usuario</label><input id="uLogin" placeholder="Ej. maria"></div><div class="field"><label>Rol</label><select id="uRole"><option>Mesero</option><option>Preparación</option><option>Cajero</option><option>Administrador</option></select></div><div class="notice">La contraseña y recuperación de acceso se configurarán cuando se conecte el módulo de autenticación.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAppUser()">Crear usuario</button></div>`)}
function saveAppUser(){const name=$('uName').value.trim(),username=$('uLogin').value.trim(),role=$('uRole').value;if(!name||!username){alert('Completa nombre y usuario');return}if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){alert('Ese nombre de usuario ya existe');return}db.users.push({id:db.seq.user++,name,username,role,active:true});closeModal();refreshWaiterSelect();commit()}
function toggleAppUser(id){const u=db.users.find(x=>x.id===id);u.active=!u.active;refreshWaiterSelect();commit()}

/* ================== Informes ================== */
const monthKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)};
function monthLabel(key){const [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'})}
const monthOrders=key=>db.orders.filter(o=>monthKey(o.createdAt)===key);
function monthlySummary(key){const list=monthOrders(key),paid=list.filter(o=>o.paid),pending=list.filter(o=>!o.paid);return {list,paid,pending,total:list.reduce((s,o)=>s+totalOrder(o),0),paidTotal:paid.reduce((s,o)=>s+totalOrder(o),0),pendingTotal:pending.reduce((s,o)=>s+totalOrder(o),0)}}
function renderReports(v){const key=window.reportMonth||todayISO().slice(0,7),s=monthlySummary(key),top=topProducts(s.list),maxQ=top[0]?.qty||1,units=top.reduce((a,t)=>a+t.qty,0);
 v.innerHTML=head('Informes y cuentas del mes','Consulta ventas, productos más vendidos, cobros y saldos pendientes por período',`<button class="btn primary" onclick="exportMonthlyExcel()">⇩ Exportar Excel</button>`)+
 `<div class="card" style="margin-bottom:16px"><div class="toolbar" style="align-items:center;margin:0"><label for="reportMonth" style="font-size:12px;font-weight:700">Mes del informe</label><input id="reportMonth" type="month" value="${key}" onchange="window.reportMonth=this.value;render()"><span class="sub">${monthLabel(key)}</span></div></div>
 <div class="grid stats"><div class="card"><div class="stat-label">Pedidos del mes</div><div class="stat-value">${s.list.length}</div></div><div class="card"><div class="stat-label">Valor total generado</div><div class="stat-value">${money(s.total)}</div></div><div class="card"><div class="stat-label">Total recaudado</div><div class="stat-value">${money(s.paidTotal)}</div></div><div class="card"><div class="stat-label">Producto más vendido</div><div class="stat-value" style="font-size:18px">${top[0]?top[0].p.emoji+' '+esc(top[0].p.name):'—'}</div><div class="stat-note">${top[0]?top[0].qty+' unidades':''}</div></div></div>
 <div class="grid layout2"><section class="card"><div class="section-title"><div><h3>Productos más vendidos</h3><p class="sub">Unidades pedidas en ${monthLabel(key)}</p></div></div>${top.length?top.map((t,i)=>`<div class="rank-row"><span class="rank-n">${i+1}</span><div class="rank-main"><div class="rank-top"><strong>${t.p.emoji} ${esc(t.p.name)}</strong><span><b>${t.qty}</b> und · ${money(t.value)}</span></div><div class="bar"><span style="width:${Math.max(4,t.qty/maxQ*100)}%"></span></div><small class="sub">${Math.round(t.qty/units*100)}% de las unidades vendidas</small></div></div>`).join(''):'<div class="empty">No hay ventas en este mes.</div>'}</section>
 <section class="card"><div class="section-title"><h3>Resumen y medios de pago</h3><span class="pill">${monthLabel(key)}</span></div><div class="order-row"><span>Consumo total registrado</span><strong>${money(s.total)}</strong></div><div class="order-row"><span>Pagos recibidos</span><strong>${money(s.paidTotal)}</strong></div><div class="order-row"><span>Saldo por cobrar</span><strong>${money(s.pendingTotal)}</strong></div>${['Efectivo','Transferencia','Datáfono'].map(m=>`<div class="order-row"><span>${m}</span><strong>${money(s.paid.filter(o=>o.payment===m).reduce((a,o)=>a+totalOrder(o),0))}</strong></div>`).join('')}</section></div>
 <section class="card" style="margin-top:16px"><div class="section-title"><div><h3>Detalle de cuentas del mes</h3><p class="sub">Cada pedido se incluye dentro de la cuenta de su mesa.</p></div></div><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Mesa</th><th>Mesero</th><th>Fecha</th><th>Estado de cuenta</th><th>Medio de pago</th><th>Factura</th><th>Total</th></tr></thead><tbody>${s.list.length?s.list.slice().reverse().map(o=>`<tr><td>#${o.id}</td><td>Mesa ${o.table}</td><td>${esc(o.waiter)}</td><td>${new Date(o.createdAt).toLocaleDateString('es-CO')}</td><td>${o.paid?'Pagada':'Pendiente'}</td><td>${esc(o.payment)||'—'}</td><td>${o.invoiceNo?`<button class="btn small" onclick="printInvoice('${o.invoiceNo}')">${o.invoiceNo}</button>`:'—'}</td><td><strong>${money(totalOrder(o))}</strong></td></tr>`).join(''):`<tr><td colspan="8" class="empty">No hay cuentas para este mes.</td></tr>`}</tbody></table></div></section>`}
function exportMonthlyExcel(){const key=window.reportMonth||todayISO().slice(0,7),s=monthlySummary(key),top=topProducts(s.list);
 const rows=[['LA CAVA - REPORTE MENSUAL',monthLabel(key)],[],['Indicador','Valor'],['Pedidos / cuentas',s.list.length],['Consumo total',s.total],['Total recaudado',s.paidTotal],['Saldo pendiente',s.pendingTotal],[],['Productos más vendidos','Unidades','Valor'],...top.map(t=>[t.p.name,t.qty,t.value]),[],['Pedido','Mesa','Mesero','Fecha','Estado','Medio de pago','Aprobación datáfono','Factura','Total'],...s.list.map(o=>[o.id,'Mesa '+o.table,o.waiter,new Date(o.createdAt).toLocaleDateString('es-CO'),o.paid?'Pagada':'Pendiente',o.payment||'',o.approvalNumber||'',o.invoiceNo||'',totalOrder(o)])];
 const headRows=new Set([0,2,8,10+top.length]);const table=rows.map((r,i)=>'<tr>'+r.map(c=>{const t=headRows.has(i)?'th':'td';return `<${t}>${esc(c)}</${t}>`}).join('')+'</tr>').join('');
 const blob=new Blob(['﻿<html><head><meta charset="utf-8"></head><body><table>'+table+'</table></body></html>'],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`la-cava-reporte-${key}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ================== Modal e inicio ================== */
function showModal(content){$('modal').innerHTML=content;$('modalBack').classList.add('show');$('modal').scrollTop=0}
function closeModal(){stopQrCamera();ord=null;$('modalBack').classList.remove('show');render()}
$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
db=loadState();saveState();
switchRole(activeRole);

</script>
