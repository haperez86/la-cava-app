spring:
  application:
    name: la-cava
  config:
    # backend/.env (no versionado) con DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, QR_SECRET
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/la_cava}
    username: ${DB_USER:lacava}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:}
  business-zone: America/Bogota

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
